services:
  - type: web
    name: piggymath-social-studio
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: IG_USER_ID
        value: 17841438053748611
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: PINTEREST_ACCESS_TOKEN
        sync: false
      - key: PINTEREST_BOARD_ID
        value: PiggyMath Financial Tips
